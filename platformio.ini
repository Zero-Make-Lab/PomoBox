; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = pomobox_c3_usb

[env]
monitor_speed = 921600  ; the mirror link (docs/specs/usb-mirror.md)
; chain+ evaluates #if, so each board only pulls in its own libraries
lib_ldf_mode = chain+

; Zer0 rev C: RP2040, 2 MB W25Q16 flash, ER-TFT032A3-3 (ST7789V). Pins: include/config.h
[env:zer0_revc]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = rpipico
board_build.core = earlephilhower
framework = arduino
; settings and focus stats live in LittleFS (the ESP32 keeps them in NVS)
board_build.filesystem_size = 0.5m
lib_deps =
	adafruit/Adafruit GFX Library
	adafruit/Adafruit ST7735 and ST7789 Library

; The original PomoBox hardware: ESP32-WROOM-32E devkit, 3.2" ILI9341 module, KY-040 encoder
[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino

; If you see "MD5 of file does not match data in flash" or "Serial data stream stopped",
; the serial link/power is often marginal (cable/hub/power/peripherals). Slowing upload helps.
upload_speed = 57600

lib_deps =
	adafruit/Adafruit GFX Library
	adafruit/Adafruit ILI9341
	madhephaestus/ESP32Encoder

; Zer0 DIY board: the same ESP32 DevKitC (USB-C), 3.2" ILI9341 module (MSP3217) and KY-040, plus a battery, a TP4056
; charging from the DevKitC's USB-C and the press-the-knob power latch. Pins: include/config.h
[env:zer0_diy]
extends = env:esp32dev
build_flags = -D ZER0_DIY

; PomoBox DIY rev C: DFR1075 FireBeetle 2 ESP32-C6, DC-DC revision.
; Keep a separate target: the rev B binary and connector pinout are incompatible.
[env:pomobox_c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = dfrobot_firebeetle2_esp32c6
framework = arduino
build_flags = -D POMOBOX_C6
lib_deps =
	adafruit/Adafruit GFX Library
	adafruit/Adafruit ILI9341

; Host unit tests for the board layer's logic: pio test -e native (needs gcc on PATH)
[env:native]
platform = native
test_build_src = no

; Waveshare ESP32-C3-Zero V2, USB-only through-hole carrier.
[env:pomobox_c3_usb]
extends = env:pomobox_c6
board = esp32-c3-devkitm-1
build_flags = -D POMOBOX_C3_USB -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1
upload_speed = 460800
